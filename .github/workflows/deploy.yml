name: Deploy Ayah Reader to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure Target Directory Exists
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.TARGET_DIR }} && chmod 755 ${{ secrets.TARGET_DIR }}"

      # كل push يعطي الـ Service Worker رقم إصدار جديد (رقم الـ commit)،
      # فيثبّت المتصفح النسخة الجديدة ويمسح الكاش القديم تلقائيًا عند الزوار
      - name: Stamp Service Worker Version
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" sw.js
          grep -n "const VERSION" sw.js

      - name: Sync Files to Server via Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tools' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_DIR }}/

